services:
  api:
    build:
      context: .
      dockerfile: SmartInventory.API/Dockerfile

    container_name: smartinventory-api

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_HTTP_PORTS: "8080"

      ConnectionStrings__DefaultConnection: "Server=host.docker.internal;Database=SmartInventoryDB;User Id=sa;Password=1234;TrustServerCertificate=True;"